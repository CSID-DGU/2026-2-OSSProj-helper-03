# PR 을 올리거나 main 에 합쳐질 때마다 엔진 테스트와 화면 빌드를 자동으로 확인한다.
# 결과는 PR 화면의 체크(✅ / ❌)와 Actions 탭에서 볼 수 있다.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    name: 엔진 (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Src/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -v

  ui:
    name: 화면 (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Src/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Src/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
